name: VoiKoo

options:
  bundleIdPrefix: com.stefanwiggeshoff
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.2.0"

targets:
  VoiKoo:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: VoiKoo
        excludes:
          - "**/*.md"
    resources:
      - path: VoiKoo/Resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: VoiKoo
        PRODUCT_BUNDLE_IDENTIFIER: com.stefanwiggeshoff.VoiKoo
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: VoiKoo/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiKoo/VoiKoo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Menu bar apps don't need a dock icon
        # LSUIElement in Info.plist handles this, but setting the app category
        # helps with proper classification
        APPLICATION_EXTENSION_API_ONLY: NO
      configs:
        debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          CODE_SIGN_IDENTITY: "Apple Development"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

schemes:
  VoiKoo:
    build:
      targets:
        VoiKoo: all
    run:
      config: Debug
    archive:
      config: Release
